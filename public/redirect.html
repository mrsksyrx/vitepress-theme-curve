<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>安全中心 | 泠の小站</title>
    <script>
      // 与主站同一套明暗/主题色约定：读取 pinia-persistedstate 的 siteData，
      // 给 <html> 打上 light/dark 与 theme-* class（与 App.vue changeSiteThemeType 对齐）
      (function () {
        try {
          var data = JSON.parse(localStorage.getItem("siteData") || "{}");
          var root = document.documentElement;
          var themeType = data.themeType || "auto";
          var isDark =
            themeType === "dark" ||
            (themeType !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          root.classList.add(isDark ? "dark" : "light");
          if (data.themeColor && data.themeColor !== "pink") {
            root.classList.add("theme-" + data.themeColor);
          }
          if (data.customThemeEnabled && /^#(?:[0-9a-fA-F]{3}){1,2}$/.test(data.customPrimaryColor || "")) {
            root.style.setProperty("--main-color", data.customPrimaryColor);
            root.style.setProperty("--main-color-bg", data.customPrimaryColor + "0d");
          }
        } catch (e) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        user-select: none;
        box-sizing: border-box;
      }
      /* 与主站 main.scss 同一套设计变量（粉主题默认 + 明暗 + theme-* 变体） */
      :root {
        --main-color: #e8558e;
        --main-color-bg: #e8558e0d;
        --main-site-background: linear-gradient(135deg, #fce8ef 0%, #e8f0fc 100%);
        --main-card-background: #ffffff;
        --main-card-second-background: #eaf2fe;
        --main-font-color: #363636;
        --main-font-second-color: #3c3c43cc;
        --main-card-border: #f0e4ea;
        --main-border-shadow: #2c2d300c;
        --main-info-color: #50bfff;
        --main-warning-color: #ffa500;
        --main-success-color: #13ce66;
        --main-error-color: #ff3842;
        --press-in: 80ms;
        --press-out: 160ms;
        --press-ease: cubic-bezier(0.4, 0, 0.2, 1);
        --main-font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell,
          "Helvetica Neue", sans-serif;
      }
      html.dark {
        --main-color: #f06292;
        --main-color-bg: #f0629223;
        --main-site-background: linear-gradient(135deg, #2a1f25 0%, #1f2233 100%);
        --main-card-background: #251e24;
        --main-card-second-background: #1e2230;
        --main-font-color: #f7f7fa;
        --main-font-second-color: #a1a2b8;
        --main-card-border: #3d3d3f;
        --main-border-shadow: #00000050;
      }
      /* 无持久化数据时跟随系统 */
      @media (prefers-color-scheme: dark) {
        html:not([class]) {
          --main-color: #f06292;
          --main-color-bg: #f0629223;
          --main-site-background: linear-gradient(135deg, #2a1f25 0%, #1f2233 100%);
          --main-card-background: #251e24;
          --main-card-second-background: #1e2230;
          --main-font-color: #f7f7fa;
          --main-font-second-color: #a1a2b8;
          --main-card-border: #3d3d3f;
          --main-border-shadow: #00000050;
        }
      }
      html.theme-purple {
        --main-color: #8000ff;
        --main-color-bg: #8000ff0d;
        --main-accent: #b39ddb;
        --main-site-background: linear-gradient(135deg, #ede7f6 0%, #f3e5f5 100%);
        --main-card-second-background: #ede7f6;
        --main-card-border: #d1c4e9;
      }
      html.dark.theme-purple {
        --main-color: #b388ff;
        --main-color-bg: #b388ff23;
        --main-site-background: linear-gradient(135deg, #2a1f33 0%, #251e2a 100%);
        --main-card-background: #251e2a;
        --main-card-second-background: #2e1a35;
        --main-card-border: #3d2e4a;
      }
      html.theme-blue {
        --main-color: #4fc3f7;
        --main-color-bg: #4fc3f70d;
        --main-site-background: linear-gradient(135deg, #e1f5fe 0%, #e0f7fa 100%);
        --main-card-second-background: #e0f7fa;
        --main-card-border: #b2ebf2;
      }
      html.dark.theme-blue {
        --main-color: #81d4fa;
        --main-color-bg: #81d4fa23;
        --main-site-background: linear-gradient(135deg, #1a2533 0%, #152033 100%);
        --main-card-background: #1a2533;
        --main-card-second-background: #1a2a40;
        --main-card-border: #2a3a4a;
      }
      html.theme-red {
        --main-color: #ef5350;
        --main-color-bg: #ef53500d;
        --main-site-background: linear-gradient(135deg, #ffebee 0%, #fff3e0 100%);
        --main-card-second-background: #fff3e0;
        --main-card-border: #ef9a9a;
      }
      html.dark.theme-red {
        --main-color: #ef9a9a;
        --main-color-bg: #ef9a9a23;
        --main-site-background: linear-gradient(135deg, #2a1a1a 0%, #2a201a 100%);
        --main-card-background: #2a1a1a;
        --main-card-second-background: #332019;
        --main-card-border: #4a2a2a;
      }
      html.theme-green {
        --main-color: #66bb6a;
        --main-color-bg: #66bb6a0d;
        --main-site-background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 100%);
        --main-card-second-background: #c8e6c9;
        --main-card-border: #a5d6a7;
      }
      html.dark.theme-green {
        --main-color: #a5d6a7;
        --main-color-bg: #a5d6a723;
        --main-site-background: linear-gradient(135deg, #1a2e1a 0%, #152515 100%);
        --main-card-background: #1a2e1a;
        --main-card-second-background: #1a331a;
        --main-card-border: #2a4a2a;
      }
      html.theme-gray {
        --main-color: #9e9e9e;
        --main-color-bg: #9e9e9e0d;
        --main-site-background: linear-gradient(135deg, #e8e8e8 0%, #d5d5d5 100%);
        --main-card-background: #f5f5f5;
        --main-card-second-background: #e0e0e0;
        --main-card-border: #bdbdbd;
        --main-info-color: #9e9e9e;
        --main-warning-color: #9e9e9e;
        --main-success-color: #9e9e9e;
        --main-error-color: #9e9e9e;
      }
      html.dark.theme-gray {
        --main-color: #757575;
        --main-color-bg: #75757523;
        --main-site-background: linear-gradient(135deg, #1a1a1a 0%, #151515 100%);
        --main-card-background: #1c1c1c;
        --main-card-second-background: #252525;
        --main-card-border: #333333;
        --main-info-color: #757575;
        --main-warning-color: #757575;
        --main-success-color: #757575;
        --main-error-color: #757575;
      }
      a {
        text-decoration: none;
        color: var(--main-font-second-color);
      }
      body {
        /* 渐变值只能挂在 background / background-image，不能用 background-color */
        background: var(--main-site-background);
        color: var(--main-font-color);
        font-family: var(--main-font-family);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        width: 100vw;
        width: 100dvw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        transition:
          color 0.3s,
          background-color 0.3s;
      }
      header {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      header .logo img {
        width: 100px;
        height: 100px;
        margin-bottom: 20px;
        border-radius: 24px;
      }
      header .title {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      header .title .site-name {
        font-size: 30px;
        font-weight: bold;
      }
      header .title .site-tip {
        font-size: 20px;
        margin-top: 8px;
        color: var(--main-font-second-color);
      }
      main {
        margin: 30px 20px 60px;
        border-radius: 12px;
        padding: 30px;
        max-width: 768px;
        min-width: 380px;
        background-color: var(--main-card-background);
        border: 1px solid var(--main-card-border);
        box-shadow: 0 8px 16px -4px var(--main-border-shadow);
        transition:
          background-color 0.3s,
          border-color 0.3s,
          box-shadow 0.3s;
      }
      main .tip {
        display: flex;
        justify-content: center;
        margin-bottom: 16px;
        font-size: 15px;
        color: var(--main-font-second-color);
      }
      main #url {
        display: block;
        padding: 12px 20px;
        border-radius: 8px;
        width: 100%;
        text-align: center;
        word-break: break-all;
        user-select: text;
        font-size: 14px;
        color: var(--main-font-second-color);
        border: 1px solid var(--main-card-border);
        background-color: var(--main-card-second-background);
      }
      main #site-info {
        display: inline-flex;
        width: 100%;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        margin-top: 20px;
        font-size: 18px;
      }
      main #jump-content.warn {
        color: var(--main-warning-color);
      }
      main #jump-content.safe {
        color: var(--main-success-color);
      }
      main #jump-content.danger {
        color: var(--main-error-color);
      }
      main #jump-button {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 44px;
        width: 160px;
        margin: 30px auto 0;
        border-radius: 8px;
        font-size: 15px;
        color: var(--main-card-background);
        background-color: var(--main-color);
        transition:
          background-color 0.3s,
          box-shadow var(--press-out) var(--press-ease),
          transform var(--press-out) var(--press-ease);
        cursor: pointer;
      }
      main #jump-button:hover {
        box-shadow: 0 8px 16px -4px var(--main-border-shadow);
      }
      main #jump-button:active {
        transform: scale(0.95);
        transition-duration: var(--press-in);
      }
      footer {
        width: 100%;
        text-align: center;
        position: absolute;
        bottom: 0;
        margin: 20px;
        font-size: 15px;
        color: var(--main-font-second-color);
      }
      footer .icp::before {
        content: "|";
        margin: 0 8px;
        margin-left: 4px;
        opacity: 0.2;
      }
    </style>
  </head>

  <body>
    <header>
      <div class="logo">
        <img src="./images/logo/favicon-256.png" alt="" />
      </div>
      <div class="title">
        <span class="site-name">泠の小站</span>
        <span class="site-tip">安全中心</span>
      </div>
    </header>
    <main>
      <span class="tip">您即将离开泠の小站，前往</span>
      <span id="url"></span>
      <div id="jump-content" class="warn">
        <span id="site-info">⚠️ 该网址安全性未知，请注意您的帐号和财产安全</span>
        <div id="jump-button">继续前往</div>
      </div>
    </main>
    <footer>
      <a class="power" href="https://sgexilq.com/">
        ©
        <script>
          document.write(new Date().getFullYear());
        </script>
        泠の小站
      </a>
    </footer>
    <script>
      // 跳转网址
      let jumpLink;
      let interval;
      // 获取元素
      const urlDom = document.getElementById("url");
      const urlTip = document.getElementById("site-info");
      const jumpContent = document.getElementById("jump-content");
      const jumpButton = document.getElementById("jump-button");
      // 网址白名单
      const whitelist = [
        "*.sgexilq.com",
        "*.sgexilq.top",
        "*.20091010.xyz",
        "*.mrsksyrx.top",
        "gitee.com",
        "github.com",
        "*.baidu.com",
        "*.bing.cn",
        "npmjs.com",
      ];
      // 网址黑名单
      const blacklist = ["*.taobao.com", "*.jd.com"];
      // 精确主机匹配：*.foo.com 仅匹配 foo.com 与 foo 的直接子域，避免正则子串绕过
      const matches = (host, rule) =>
        rule.startsWith("*.")
          ? host === rule.slice(2) || host.endsWith("." + rule.slice(2))
          : host === rule;
      // 提示文本
      const tipText = {
        safe: "✅ 该网址为信任网址，即将跳转",
        danger: "⛔ 该网址处于黑名单",
      };
      // 自动跳转
      const autoJump = () => {
        let count = 3;
        const updateContent = () => {
          jumpButton.innerHTML = `${count} 秒后自动跳转`;
          count--;
          if (count < 0) {
            clearInterval(interval);
            jumpButton.innerHTML = "正在跳转";
            window.location.replace(jumpLink);
          }
        };
        // 每秒更新一次
        updateContent();
        interval = setInterval(updateContent, 1000);
      };
      // 获取跳转网址
      const getJumpUrl = () => {
        try {
          // 同时兼容 ?url= 和 #url=
          const urlParams = new URLSearchParams(window.location.search);
          const hashParams = new URLSearchParams(window.location.hash.substring(1));
          let encodedUrl = urlParams.get("url") || hashParams.get("url");
          if (!encodedUrl) {
            throw new Error("url 参数为空");
          }
          // 修复 Base64 在 URL 传递时 + 被当成空格的问题
          encodedUrl = encodedUrl.replace(/ /g, "+");
          // 解密 Base64（UTF-8 安全，与 commonTools.mjs 的 toBase64 对称；
          // 裸 atob 会把 UTF-8 字节当 Latin1 解出来，中文/emoji 链接变乱码）
          const binary = atob(encodedUrl);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
          jumpLink = new TextDecoder().decode(bytes);
          // 仅放行 http/https，阻断 javascript:/data: 等协议
          const parsed = new URL(jumpLink);
          if (parsed.protocol !== "http:" && parsed.protocol !== "https:") {
            throw new Error("不允许的协议");
          }
          jumpLink = parsed.href;
          urlDom.textContent = jumpLink;
          // 获取网址的主机名
          const urlHostname = parsed.hostname;
          // 判断网址是否在黑名单中
          for (let i = 0; i < blacklist.length; i++) {
            if (matches(urlHostname, blacklist[i])) {
              // 显示提示信息
              urlTip.textContent = tipText.danger;
              jumpButton.textContent = "禁止跳转";
              jumpButton.style.cursor = "not-allowed";
              jumpButton.style.pointerEvents = "none";
              jumpButton.style.opacity = "0.4";
              jumpContent.className = "danger";
              return true;
            }
          }
          // 判断网址是否在白名单中
          for (let i = 0; i < whitelist.length; i++) {
            if (matches(urlHostname, whitelist[i])) {
              // 显示提示信息
              urlTip.textContent = tipText.safe;
              jumpContent.className = "safe";
              autoJump();
              return true;
            }
          }
        } catch (error) {
          console.error(error);
          jumpContent.remove();
          urlDom.textContent = "获取跳转链接失败，请检查链接格式";
        }
      };
      document.addEventListener("contextmenu", function (event) {
        event.preventDefault();
      });
      document.addEventListener("keydown", function (event) {
        if (event.keyCode === 123) {
          event.preventDefault();
        }
        if (
          event.ctrlKey &&
          event.shiftKey &&
          (event.keyCode === 73 || event.keyCode === 74 || event.keyCode === 67)
        ) {
          event.preventDefault();
        }
      });
      jumpButton.addEventListener("click", () => {
        clearInterval(interval);
        jumpButton.innerHTML = "正在跳转";
        if (jumpLink) window.location.replace(jumpLink);
      });
      window.addEventListener("DOMContentLoaded", () => {
        getJumpUrl();
      });
    </script>
  </body>
</html>
